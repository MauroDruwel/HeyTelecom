[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "heytelecom"
dynamic = ["version"]
description = "A Python library for interacting with Hey Telecom accounts (no browser required)"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.8"
authors = [
    {name = "Mauro Druwel"}
]
license = {text = "MIT"}
keywords = ["hey", "telecom", "hey!", "belgium", "mobile", "internet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/maurodruwel/heytelecom"
Repository = "https://github.com/maurodruwel/heytelecom"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "heytelecom.__version__"}

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "SIM", "RET", "C4", "PERF", "PYI", "RSE", "FLY", "ARG", "RUF", "T20"]
ignore = ["T20", "PYI034"]  # T20: allow print(); PYI034: Self requires typing_extensions on py38

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PERF203"]  # try/except in loop is intentional in test helpers

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["heytelecom"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = false
fail_under = 80
